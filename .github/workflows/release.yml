name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
      - name: Validate SemVer, package version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag ?? '')) {
            throw new Error('Release tags must use stable SemVer: vMAJOR.MINOR.PATCH');
          }
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (tag !== `v${version}`) throw new Error('Tag must match package.json version');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (lock.version !== version || lock.packages?.['']?.version !== version) {
            throw new Error('package-lock.json must match package.json version');
          }
          NODE
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main

  build:
    name: Build release
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cliscope-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: artifacts
        run: |
          sha256sum cliscope-*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" cliscope-*.tar.gz SHA256SUMS --verify-tag --title "$RELEASE_TAG" --generate-notes

  publish-npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package
      # Publish the exact archive installed and tested by the consumer matrix.
      # npm authenticates using this job's OIDC identity; no NPM_TOKEN is required.
      # npm provenance is unavailable for private GitHub repositories.
      - run: npm publish package/cliscope-*.tgz --ignore-scripts --access public --tag latest --provenance=false
