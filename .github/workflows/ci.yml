name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            executable: cliscope
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            executable: cliscope
          - runner: macos-15-intel
            target: darwin-x64
            executable: cliscope
          - runner: macos-15
            target: darwin-arm64
            executable: cliscope
          - runner: windows-2025
            target: windows-x64
            executable: cliscope.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:binary
      - name: Save performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.target }}
          path: artifacts/performance*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Smoke-test standalone executable
        run: |
          ./artifacts/${{ matrix.executable }} --version
          ./artifacts/${{ matrix.executable }} --help
          ./artifacts/${{ matrix.executable }} --demo --json > artifacts/demo.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/demo.json', 'utf8'));
          assert.ok(report.totalInvocations > 0, 'Demo must contain invocations');
          assert.ok(report.tools.length > 0, 'Demo must contain ranked tools');
          NODE
      - name: Package standalone executable
        run: |
          cp LICENSE README.md artifacts/
          cp dist/THIRD_PARTY_NOTICES.txt artifacts/
          tar -czf artifacts/cliscope-${{ matrix.target }}.tar.gz -C artifacts ${{ matrix.executable }} LICENSE README.md THIRD_PARTY_NOTICES.txt
      - name: Test standalone terminal interaction
        if: runner.os != 'Windows'
        run: python3 scripts/test-terminal.py ./artifacts/${{ matrix.executable }} --demo -i
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cliscope-${{ matrix.target }}
          path: artifacts/cliscope-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: Pack npm distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "${{ runner.temp }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/cliscope-*.tgz
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Install package (Node ${{ matrix.node }}, ${{ matrix.runner }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        node: ['20.13.1', '22', '24', '26']
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package-archive
      - name: Install outside the checkout without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/package-install"
          npm install --prefix "$RUNNER_TEMP/package-install" --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/package-archive/cliscope-*.tgz
      - name: Test installed package on consumer Node
        run: node scripts/smoke-package.mjs "$RUNNER_TEMP/package-install"
      - name: Test npm executable resolution
        working-directory: ${{ runner.temp }}/package-install
        run: npm exec --no -- cliscope --demo --ascii --no-color
      - name: Test installed terminal interaction
        if: runner.os != 'Windows'
        run: |
          launcher=$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'package-install/node_modules/cliscope', require(require('node:path').join(process.env.RUNNER_TEMP, 'package-install/node_modules/cliscope/package.json')).bin.cliscope)")
          python3 scripts/test-terminal.py node "$launcher" --demo -i

  quality-gate:
    name: Quality gate
    needs: [verify, package-smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.verify.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
        run: test "$RESULT" = success && test "$PACKAGE_RESULT" = success
