name: Set up release tools
description: Install pinned release dependencies without lifecycle scripts.
inputs:
  registry:
    description: Package registry used by the job.
    default: https://registry.npmjs.org
  scope:
    description: Optional registry scope.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '26.9.0'
        registry-url: ${{ inputs.registry }}
        scope: ${{ inputs.scope }}
        package-manager-cache: false
    - run: npm ci --ignore-scripts
      shell: bash
